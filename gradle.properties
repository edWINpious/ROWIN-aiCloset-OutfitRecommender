# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AndroidX
android.useAndroidX=true
# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true
# AGP 9 built-in Kotlin (default): no separate Kotlin plugin is applied.
android.builtInKotlin=true
# Groq-powered AI + Firebase are opt-in integrations; keep keys out of source control.
ROWIN_NOTES=Add GROQ_API_KEY in local.properties (never commit). See AiKeys.kt.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
